[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-attribution-risk"
version = "0.1.0"
description = "Brinson-Fachler attribution and a Barra-style factor risk model"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["attribution", "riskmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
